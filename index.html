<style>
  :root{
    --red:#FF7402;
    --red-deep:#E86500;
    --ink:#1C1A19;
    --muted:#5E5955;
    --paper:#FFFFFF;
    --leaf:#FFF1EA;
    --line:#F1E4DD;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--paper);color:var(--ink);font:400 17px/1.6 "Manrope",system-ui,sans-serif}
  body{display:flex;flex-direction:column;min-height:100vh}
  main{flex:1}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--red);outline-offset:3px;border-radius:4px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}

  header.top{border-bottom:1px solid var(--line)}
  header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
  .logo{display:inline-flex;align-items:center;gap:10px;font:800 20px/1 "Unbounded",sans-serif;text-decoration:none;letter-spacing:-.01em;color:var(--red)}
  .logo .mark{width:34px;height:34px;flex:none}
  .logo .name span{color:var(--ink)}

  .hero{padding:72px 0 64px}
  .wordmark{display:flex;align-items:center;gap:.14em;flex-wrap:nowrap}
  .hero-mark{width:.82em;height:.82em;flex:none}
  .wordmark{font:800 clamp(34px,10.5vw,120px)/.92 "Unbounded",sans-serif;letter-spacing:-.04em;color:var(--red)}
  .wordmark .dash{color:var(--ink)}
  .hero p.lead{margin-top:28px;max-width:34ch;font-size:clamp(20px,2.4vw,26px);line-height:1.4;font-weight:500}
  .actions{margin-top:36px;display:flex;flex-direction:column;gap:14px;max-width:420px}
  .btn{display:flex;align-items:center;justify-content:center;gap:12px;padding:22px 28px;border-radius:999px;font-weight:700;text-decoration:none;font-size:20px}
  .btn svg{width:24px;height:24px}
  .btn-wa{background:var(--red-deep);color:#fff}
  .btn-wa:hover{background:#C95500}
  .btn-site{border:2px solid var(--ink)}
  .btn-site:hover{background:var(--ink);color:#fff}

  h2{font:700 clamp(26px,3.4vw,36px)/1.15 "Unbounded",sans-serif;letter-spacing:-.02em;margin-bottom:28px}



  footer{background:var(--ink);color:#D9D4CF;padding:36px 0;font-size:15px}
  footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px}
  footer b{color:#fff}

  @media (max-width:760px){
    .hero{padding:48px 0}
  }
</style>
</head>
